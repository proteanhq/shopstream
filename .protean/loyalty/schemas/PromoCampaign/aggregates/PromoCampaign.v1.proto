syntax = "proto3";
package loyalty.campaign.campaign;
import "google/protobuf/timestamp.proto";

message PromoCampaign {
  string campaign_code = 1;
  string discount_type = 2;
  int64 discount_value = 3;
  optional google.protobuf.Timestamp ends_on = 4;
  string id = 5;
  optional google.protobuf.Timestamp launched_at = 6;
  string name = 7;
  optional google.protobuf.Timestamp starts_on = 8;
  optional string status = 9;
}
