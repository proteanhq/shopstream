syntax = "proto3";
package loyalty.reward.reward_account;
import "google/protobuf/timestamp.proto";

message Auditable {
  optional google.protobuf.Timestamp created_at = 1;
  optional string created_by = 2;
  string id = 3;
  optional google.protobuf.Timestamp updated_at = 4;
  optional string updated_by = 5;
}
