syntax = "proto3";
package loyalty.reward.reward_account;
import "google/protobuf/timestamp.proto";

message RewardAccount {
  optional MembershipCard card = 1;
  optional google.protobuf.Timestamp created_at = 2;
  optional string created_by = 3;
  string customer_id = 4;
  repeated PointsLedgerEntry entries = 5;
  string id = 6;
  optional int64 lifetime_points = 7;
  string member_code = 8;
  optional google.protobuf.Timestamp membership_since = 9;
  optional int64 points_balance = 10;
  optional string referral_code = 11;
  optional string status = 12;
  optional string tier = 13;
  optional google.protobuf.Timestamp updated_at = 14;
  optional string updated_by = 15;
}

message MembershipCard {
  string card_number = 1;
  string id = 2;
  google.protobuf.Timestamp issued_on = 3;
  optional string reward_account = 4;
  optional string status = 5;
}

message PointsLedgerEntry {
  int64 amount = 1;
  int64 balance_after = 2;
  string entry_type = 3;
  string id = 4;
  google.protobuf.Timestamp occurred_at = 5;
  optional string reason = 6;
  optional string reward_account = 7;
}
