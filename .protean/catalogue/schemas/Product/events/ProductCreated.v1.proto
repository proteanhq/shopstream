syntax = "proto3";
package catalogue.product.events;
import "google/protobuf/timestamp.proto";

message ProductCreated {
  optional string category_id = 1;
  google.protobuf.Timestamp created_at = 2;
  string product_id = 3;
  optional string seller_id = 4;
  string sku = 5;
  string status = 6;
  string title = 7;
}
