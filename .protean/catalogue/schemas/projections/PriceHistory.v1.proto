syntax = "proto3";
package catalogue.projections.price_history;
import "google/protobuf/timestamp.proto";

message PriceHistory {
  google.protobuf.Timestamp changed_at = 1;
  string currency = 2;
  string entry_id = 3;
  string new_price = 4;
  string previous_price = 5;
  string product_id = 6;
  string variant_id = 7;
}
