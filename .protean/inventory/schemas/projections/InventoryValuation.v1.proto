syntax = "proto3";
package inventory.projections.inventory_valuation;
import "google/protobuf/timestamp.proto";

message InventoryValuation {
  string inventory_item_id = 1;
  optional int64 on_hand = 2;
  string product_id = 3;
  optional string sku = 4;
  optional string total_value = 5;
  optional string unit_cost = 6;
  optional google.protobuf.Timestamp updated_at = 7;
  string variant_id = 8;
  optional string warehouse_id = 9;
}
