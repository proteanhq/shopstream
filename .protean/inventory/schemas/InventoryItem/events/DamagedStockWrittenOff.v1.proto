syntax = "proto3";
package inventory.stock.events;
import "google/protobuf/timestamp.proto";

message DamagedStockWrittenOff {
  string approved_by = 1;
  string inventory_item_id = 2;
  int64 new_damaged = 3;
  int64 previous_damaged = 4;
  string product_id = 5;
  int64 quantity = 6;
  google.protobuf.Timestamp written_off_at = 7;
}
