syntax = "proto3";
package notifications.notification.events;
import "google/protobuf/timestamp.proto";

message NotificationFailed {
  string channel = 1;
  google.protobuf.Timestamp failed_at = 2;
  int64 max_retries = 3;
  string notification_id = 4;
  string reason = 5;
  string recipient_id = 6;
  int64 retry_count = 7;
}
