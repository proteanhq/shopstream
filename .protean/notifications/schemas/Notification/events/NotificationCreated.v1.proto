syntax = "proto3";
package notifications.notification.events;
import "google/protobuf/timestamp.proto";

message NotificationCreated {
  string channel = 1;
  google.protobuf.Timestamp created_at = 2;
  string notification_id = 3;
  string notification_type = 4;
  string recipient_id = 5;
  string recipient_type = 6;
  optional google.protobuf.Timestamp scheduled_for = 7;
  optional string source_event_type = 8;
  optional string subject = 9;
  optional string template_name = 10;
}
