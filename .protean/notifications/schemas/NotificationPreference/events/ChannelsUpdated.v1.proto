syntax = "proto3";
package notifications.preference.events;
import "google/protobuf/timestamp.proto";

message ChannelsUpdated {
  string customer_id = 1;
  bool email_enabled = 2;
  string preference_id = 3;
  bool push_enabled = 4;
  bool sms_enabled = 5;
  google.protobuf.Timestamp updated_at = 6;
}
