syntax = "proto3";
package notifications.preference.preference;
import "google/protobuf/timestamp.proto";

message NotificationPreference {
  optional google.protobuf.Timestamp created_at = 1;
  string customer_id = 2;
  optional bool email_enabled = 3;
  string id = 4;
  optional bool push_enabled = 5;
  optional string quiet_hours_end = 6;
  optional string quiet_hours_start = 7;
  optional bool sms_enabled = 8;
  repeated string unsubscribed_types = 9;
  optional google.protobuf.Timestamp updated_at = 10;
}
