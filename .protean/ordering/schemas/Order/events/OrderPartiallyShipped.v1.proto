syntax = "proto3";
package ordering.order.events;
import "google/protobuf/timestamp.proto";

message OrderPartiallyShipped {
  string carrier = 1;
  string order_id = 2;
  string shipment_id = 3;
  google.protobuf.Timestamp shipped_at = 4;
  repeated string shipped_item_ids = 5;
  string tracking_number = 6;
}
