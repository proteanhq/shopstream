syntax = "proto3";
package ordering.order.events;
import "google/protobuf/timestamp.proto";

message ItemQuantityUpdated {
  string item_id = 1;
  double new_grand_total = 2;
  string new_quantity = 3;
  double new_subtotal = 4;
  string order_id = 5;
  string previous_quantity = 6;
  google.protobuf.Timestamp updated_at = 7;
}
