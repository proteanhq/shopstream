syntax = "proto3";
package ordering.order.events;
import "google/protobuf/timestamp.proto";

message ItemAdded {
  google.protobuf.Timestamp added_at = 1;
  string item_id = 2;
  string new_grand_total = 3;
  string new_subtotal = 4;
  string order_id = 5;
  string product_id = 6;
  string quantity = 7;
  string sku = 8;
  string title = 9;
  string unit_price = 10;
  string variant_id = 11;
}
