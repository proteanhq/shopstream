syntax = "proto3";
package ordering.projections.daily_order_stats;

message DailyOrderStats {
  string date = 1;
  optional int64 orders_cancelled = 2;
  optional int64 orders_completed = 3;
  optional int64 orders_created = 4;
  optional int64 orders_refunded = 5;
  optional string total_refunds = 6;
  optional string total_revenue = 7;
}
