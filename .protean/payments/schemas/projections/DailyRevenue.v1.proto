syntax = "proto3";
package payments.projections.daily_revenue;

message DailyRevenue {
  optional string currency = 1;
  string date = 2;
  optional string net_revenue = 3;
  optional int64 refund_count = 4;
  optional string total_refunded = 5;
  optional string total_revenue = 6;
  optional int64 transaction_count = 7;
}
