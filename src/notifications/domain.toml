debug = true
testing = false
secret_key = "${SECRET_KEY|a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2}"
identity_strategy = "uuid"
identity_type = "string"
event_processing = "async"
command_processing = "sync"
message_processing = "sync"

# Engine subscriptions use Redis Streams (outbox → broker → projectors).
# Protean defaults to "event_store"; override to "stream" for outbox pattern.
[server]
default_subscription_type = "stream"
default_subscription_profile = "shopstream"

# Every engine subscription starts from this profile: production's batch size,
# retries, DLQ and circuit breaker, with a stream cap of 50000 entries instead of
# production's 100000. Protean trims the stream after each batch. With one consumer
# group it keeps the newest 50000 entries, so a group further behind than that loses
# its oldest unread entries. With two or more groups it ignores the cap and deletes
# every entry older than the last one handed to the furthest-behind group. That
# includes entries a group failed to process and has not acknowledged, which are
# then never retried (a Protean bug, pinned in verification/regression).
[server.profiles.shopstream]
inherits = "production"
retention_maxlen = 50000

# NotificationDispatcher is the one handler that calls an external channel, and
# a channel outage fails it on every message. Its breaker opens after 5 failures
# in a row instead of 10 and lets one probe message through after 30 seconds
# instead of 60. While it is open the subscription reads no new messages, but the
# batch it was processing when it opened still runs to the end. Each failed probe
# is another attempt at the oldest message, which goes to the DLQ after 3 attempts.
# One breaker covers all four channels: an Email outage pauses SMS, Push and Slack
# too, and a working channel in between resets the failure count. So does every
# other Notification event on the stream, which the dispatcher ignores and Protean
# counts as a success, and so does the claim before each send: NotificationCreated
# and NotificationDispatchRequested come before each NotificationDispatchStarted,
# so an outage opens the breaker only when retries pile up between new notifications.
[server.subscriptions.NotificationDispatcher]
circuit_breaker_threshold = 5
circuit_breaker_reset_seconds = 30

# Health-check HTTP server. ShopStream keeps `port` to `port` + 9 for this
# context's `--workers` workers; each worker after the first takes the next free
# port (see verification/contracts/test_process_ports.py).
[server.health]
host = "${PROTEAN_HEALTH_HOST|127.0.0.1}"
port = 8170
port_auto_increment = true

# Priority Lanes: Route low-priority events (migrations, bulk imports) to a
# separate Redis Stream so production events are always processed first.
[server.priority_lanes]
enabled = true
threshold = 0           # priority < 0 → backfill lane
backfill_suffix = "backfill"

# Outbox pattern: events are written to an outbox table in the same
# transaction as the aggregate mutation, then asynchronously forwarded
# to the broker (Redis Streams) by the Engine's OutboxProcessor.
[outbox]
broker = "default"
external_brokers = ["global"]
messages_per_tick = 50
tick_interval = 0.01

# Consume-side idempotency: idempotent projectors record one processed-message
# marker per event and handler, so a redelivered event is skipped. Markers are
# only needed while a redelivery can still arrive. `make idempotency-cleanup`
# deletes markers older than retention_hours (one week), batch_size rows at a time.
[consume_idempotency.cleanup]
retention_hours = 168
batch_size = 5000

# Default Database Configuration (used in development / PROTEAN_ENV unset)
[databases.default]
provider = "postgresql"
database_uri = "${NOTIFICATIONS_DATABASE_URL|postgresql://postgres:postgres@localhost:15432/notifications_local}"

# Default Event Store Configuration
[event_store]
provider = "message_db"
database_uri = "${MESSAGE_DB_URL|postgresql://message_store:message_store@localhost:15433/message_store}"

# Default Broker Configuration (internal events — domain-specific Redis DB)
[brokers.default]
provider = "redis"
URI = "${REDIS_URL|redis://127.0.0.1:16379/7}"

# External Broker (shared bus for cross-domain published events)
[brokers.global]
provider = "redis"
URI = "${REDIS_EXTERNAL_URL|redis://127.0.0.1:16379/15}"

# ──────────────────────────────────────────────
# Test overrides (PROTEAN_ENV=test)
# Separate database so test runs don't destroy dev data.
# ──────────────────────────────────────────────
[test]
testing = true
event_processing = "sync"

[test.databases.default]
database_uri = "${TEST_NOTIFICATIONS_DATABASE_URL|postgresql://postgres:postgres@localhost:15432/notifications_test}"

# Test runs get their own Redis DBs (10 internal, 14 shared bus), away from the dev
# DBs, so a test that writes to or flushes a stream never touches a dev engine's data.
# CI sets REDIS_URL and REDIS_EXTERNAL_URL, which take precedence.
[test.brokers.default]
provider = "redis"
URI = "${REDIS_URL|redis://127.0.0.1:16379/10}"

[test.brokers.global]
provider = "redis"
URI = "${REDIS_EXTERNAL_URL|redis://127.0.0.1:16379/14}"

# ──────────────────────────────────────────────
# Production overrides (PROTEAN_ENV=production)
# Events are processed asynchronously by Engine workers,
# not synchronously during UoW commit.
# ──────────────────────────────────────────────
[production]
event_processing = "async"
debug = false

# OpenTelemetry (enable by setting OTEL_EXPORTER_OTLP_ENDPOINT)
[production.telemetry]
enabled = true
service_name = "shopstream-notifications"

[production.databases.default]
database_uri = "${NOTIFICATIONS_DATABASE_URL|postgresql://postgres:postgres@localhost:15432/notifications}"

# ──────────────────────────────────────────────
# Memory overrides (PROTEAN_ENV=memory)
# Fast in-memory adapters for quick test feedback.
# No Docker, PostgreSQL, Redis, or Message DB required.
# ──────────────────────────────────────────────
[memory]
testing = true
event_processing = "sync"

[memory.databases.default]
provider = "memory"

[memory.event_store]
provider = "memory"

[memory.brokers.default]
provider = "inline"

[memory.brokers.global]
provider = "inline"
