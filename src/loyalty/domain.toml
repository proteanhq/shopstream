debug = true
testing = false
secret_key = "${SECRET_KEY|a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6}"
identity_strategy = "uuid"
identity_type = "string"
event_processing = "async"
command_processing = "sync"
message_processing = "sync"

# Event-sourcing snapshots: after this many events on a stream, reconstruction can
# fold from a snapshot instead of replaying the full history (PromoCampaign).
snapshot_threshold = 5

# Engine subscriptions use Redis Streams (outbox → broker → projectors).
[server]
default_subscription_type = "stream"
default_subscription_profile = "shopstream"

# Every engine subscription starts from this profile: production's batch size,
# retries, DLQ and circuit breaker, with a stream cap of 50000 entries instead of
# production's 100000. Protean trims the stream after each batch. With one consumer
# group it keeps the newest 50000 entries, so a group further behind than that loses
# its oldest unread entries. With two or more groups it ignores the cap and deletes
# every entry older than the last one handed to the furthest-behind group. That
# includes entries a group failed to process and has not acknowledged, which are
# then never retried (a Protean bug, pinned in verification/regression).
[server.profiles.shopstream]
inherits = "production"
retention_maxlen = 50000

# Health-check HTTP server. ShopStream keeps `port` to `port` + 9 for this
# context's `--workers` workers; each worker after the first takes the next free
# port (see verification/contracts/test_process_ports.py).
[server.health]
host = "${PROTEAN_HEALTH_HOST|127.0.0.1}"
port = 8180
port_auto_increment = true

[server.priority_lanes]
enabled = true
threshold = 0
backfill_suffix = "backfill"

[outbox]
broker = "default"
external_brokers = ["global"]
messages_per_tick = 50
tick_interval = 0.01

# `protean check` findings waived for this context. Each entry silences the first N
# findings of that code in sorted order, not the element named below. When the named
# finding goes away, lower the count, or it will waive the next finding of that code.
[lint.suppressions]
# Auditable is an abstract aggregate (RewardAccount's base). It is never loaded or
# saved, so a command handler for it would have nothing to act on. The rule does not
# skip abstract aggregates, unlike its sibling rules.
AGGREGATE_WITHOUT_COMMAND_HANDLER = 1
# MembershipCardIssued and MembershipCardIssuedV2. The first is deprecated and nothing
# raises it any more; it stays registered until its removal so the deprecation warning
# and the DEPRECATED_ELEMENT diagnostic keep pointing callers at V2. The second
# records the card issue on the account's stream, and no read model shows membership
# cards yet, so nothing handles it. Lower this to 1 when either finding goes away.
UNHANDLED_EVENT = 2
# RewardAccount.points_balance in RewardAccountRepository.never_redeemed. The filter
# compares two columns (points_balance = lifetime_points), which a single-column index
# would not serve.
UNINDEXED_FILTER_PATH = 1

# Consume-side idempotency: idempotent projectors record one processed-message
# marker per event and handler, so a redelivered event is skipped. Markers are
# only needed while a redelivery can still arrive. `make idempotency-cleanup`
# deletes markers older than retention_hours (one week), batch_size rows at a time.
[consume_idempotency.cleanup]
retention_hours = 168
batch_size = 5000

# Default Database (development / PROTEAN_ENV unset)
[databases.default]
provider = "postgresql"
database_uri = "${LOYALTY_DATABASE_URL|postgresql://postgres:postgres@localhost:15432/loyalty_local}"

# Second persistence provider — a SQLite "reporting" store backing the CampaignCatalog read
# model. Exercises Protean running more than one database provider in a single domain (default
# PostgreSQL for everything else + this SQLite). SQLite is embedded (no server), so the second
# provider runs in every environment without extra infrastructure.
[databases.reporting]
provider = "sqlite"
database_uri = "${LOYALTY_REPORTING_URL|sqlite:////tmp/loyalty_reporting.db}"

[event_store]
provider = "message_db"
database_uri = "${MESSAGE_DB_URL|postgresql://message_store:message_store@localhost:15433/message_store}"

# Internal broker — loyalty owns Redis DB 8
[brokers.default]
provider = "redis"
URI = "${REDIS_URL|redis://127.0.0.1:16379/8}"

# External (shared) bus for cross-domain published events
[brokers.global]
provider = "redis"
URI = "${REDIS_EXTERNAL_URL|redis://127.0.0.1:16379/15}"

# Cache — backs the live points-leaderboard projection (cache="loyalty")
[caches.loyalty]
provider = "redis"
URI = "${REDIS_CACHE_URL|redis://127.0.0.1:16379/9}"
TTL = 3600

# ──────────────────────────────────────────────
# Test overrides (PROTEAN_ENV=test)
# ──────────────────────────────────────────────
[test]
testing = true
event_processing = "sync"

[test.databases.default]
database_uri = "${TEST_LOYALTY_DATABASE_URL|postgresql://postgres:postgres@localhost:15432/loyalty_test}"

# Separate SQLite file for tests so runs never touch the dev reporting store.
[test.databases.reporting]
database_uri = "${TEST_LOYALTY_REPORTING_URL|sqlite:////tmp/loyalty_reporting_test.db}"

# Use the in-memory cache in tests so the PointsLeaderboard cache projection works
# without a dedicated Redis cache instance.
[test.caches.loyalty]
provider = "memory"

# ──────────────────────────────────────────────
# Production overrides (PROTEAN_ENV=production)
# ──────────────────────────────────────────────
[production]
event_processing = "async"
debug = false

[production.telemetry]
enabled = true
service_name = "shopstream-loyalty"

[production.databases.default]
database_uri = "${LOYALTY_DATABASE_URL|postgresql://postgres:postgres@localhost:15432/loyalty}"

# ──────────────────────────────────────────────
# Memory overrides (PROTEAN_ENV=memory)
# ──────────────────────────────────────────────
[memory]
testing = true
event_processing = "sync"

[memory.databases.default]
provider = "memory"

# The reporting store also runs in-memory under the memory env (no SQLite file needed).
[memory.databases.reporting]
provider = "memory"

[memory.event_store]
provider = "memory"

[memory.brokers.default]
provider = "inline"

[memory.brokers.global]
provider = "inline"

[memory.caches.loyalty]
provider = "memory"
