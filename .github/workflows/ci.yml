name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-memory:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    name: Python ${{ matrix.python-version }} Memory Tests

    # No services needed — all adapters run in-memory

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Run linting
        run: uv run ruff check src/ tests/

      - name: Run all tests (memory mode)
        run: uv run pytest --protean-env memory

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    name: Python ${{ matrix.python-version }} Tests

    services:
      postgres:
        image: postgres:11
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      message-db:
        image: ethangarofolo/message-db:1.2.6
        ports:
          - 5433:5432

    # Override domain.toml defaults (ports 15432/15433/16379 for local Docker)
    # with CI service ports (5432/5433/6379).
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/identity_local
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/identity_test
      CATALOGUE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalogue_local
      TEST_CATALOGUE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalogue_test
      ORDERING_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ordering_local
      TEST_ORDERING_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ordering_test
      INVENTORY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_local
      TEST_INVENTORY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_test
      PAYMENTS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payments_local
      TEST_PAYMENTS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payments_test
      FULFILLMENT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fulfillment_local
      TEST_FULFILLMENT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fulfillment_test
      REVIEWS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reviews_local
      TEST_REVIEWS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reviews_test
      NOTIFICATIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notifications_local
      TEST_NOTIFICATIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notifications_test
      LOYALTY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loyalty_local
      TEST_LOYALTY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loyalty_test
      MESSAGE_DB_URL: postgresql://message_store:message_store@localhost:5433/message_store
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Set up identity database
        run: bash src/identity/create_db.sh

      - name: Set up catalogue database
        run: bash src/catalogue/create_db.sh

      - name: Set up ordering database
        run: bash src/ordering/create_db.sh

      - name: Set up inventory database
        run: bash src/inventory/create_db.sh

      - name: Set up payments database
        run: bash src/payments/create_db.sh

      - name: Set up fulfillment database
        run: bash src/fulfillment/create_db.sh

      - name: Set up reviews database
        run: bash src/reviews/create_db.sh

      - name: Set up notifications database
        run: bash src/notifications/create_db.sh

      - name: Set up loyalty database
        run: bash src/loyalty/create_db.sh

      - name: Run linting
        run: uv run ruff check src/ tests/

      - name: Run all tests with coverage
        run: uv run pytest --cov=src/identity --cov=src/catalogue --cov=src/ordering --cov=src/inventory --cov=src/payments --cov=src/fulfillment --cov=src/reviews --cov=src/notifications --cov=src/loyalty --cov-report=xml --cov-report=term-missing

      - name: Extract coverage percentage
        if: matrix.python-version == '3.11'
        id: coverage
        run: |
          COVERAGE=$(uv run python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          rate = float(tree.getroot().attrib['line-rate'])
          print(f'{rate * 100:.1f}')
          ")
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
          # Set badge color based on coverage
          if (( $(echo "$COVERAGE >= 90" | bc -l) )); then
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            echo "color=green" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$COVERAGE >= 70" | bc -l) )); then
            echo "color=yellowgreen" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            echo "color=yellow" >> "$GITHUB_OUTPUT"
          else
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Update coverage badge
        if: matrix.python-version == '3.11' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: shopstream-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          color: ${{ steps.coverage.outputs.color }}
