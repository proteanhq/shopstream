      message-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  engine-payments:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: protean server --domain payments.domain
    volumes:
      - ./src:/app/src
      - ../protean:/protean
    environment:
      <<: *common-env
      PAYMENTS_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payments_local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      message-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  engine-fulfillment:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: protean server --domain fulfillment.domain
    volumes:
      - ./src:/app/src
      - ../protean:/protean
