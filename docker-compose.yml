      - ../protean:/protean
    environment:
      <<: *common-env
      LOYALTY_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/loyalty_local
      REDIS_CACHE_URL: redis://redis:6379/9
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      message-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

volumes:
  postgres-data:
    driver: local
  message-db-data:
    driver: local
  redis-data:
    driver: local
