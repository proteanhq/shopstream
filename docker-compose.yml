# Every application service loads at least one domain, and every domain reads
# these. Inside a container the domain.toml fallbacks point at 127.0.0.1, where
# nothing listens, so each service needs all of them.
x-common-env: &common-env
  MESSAGE_DB_URL: postgresql://message_store:message_store@message-db:5432/message_store
  REDIS_URL: redis://redis:6379/0
  REDIS_EXTERNAL_URL: redis://redis:6379/15
  PROTEAN_LOG_LEVEL: ${PROTEAN_LOG_LEVEL:-INFO}

services:
  # ──────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: identity_local
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  message-db:
    image: ethangarofolo/message-db:1.3.0
    restart: unless-stopped
    ports:
      - "15433:5432"
    environment:
      POSTGRES_PASSWORD: message_store
      MESSAGE_STORE_POSTGRES_PASSWORD: message_store
    volumes:
      - message-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U message_store"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: redis-server --appendonly yes --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG && redis-cli info server | grep -v loading:1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Application: API Server
  # ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload --app-dir src
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ../protean:/protean
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/identity_local
      CATALOGUE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/catalogue_local
      ORDERING_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ordering_local
      INVENTORY_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/inventory_local
      PAYMENTS_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payments_local
      FULFILLMENT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fulfillment_local
      REVIEWS_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/reviews_local
      NOTIFICATIONS_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notifications_local
      LOYALTY_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/loyalty_local
      REDIS_CACHE_URL: redis://redis:6379/9
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Application: Engine Workers
  #
  # Each container runs a single Engine process.
  # Scale with: docker compose up --scale engine-identity=3
  # ──────────────────────────────────────────────
  engine-identity:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: protean server --domain identity.domain
    volumes:
      - ./src:/app/src
      - ../protean:/protean
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/identity_local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      message-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  engine-catalogue:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: protean server --domain catalogue.domain
    volumes:
      - ./src:/app/src
      - ../protean:/protean
    environment:
      <<: *common-env
      CATALOGUE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/catalogue_local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      message-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  engine-ordering:
