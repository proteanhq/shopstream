# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^uv\.lock$
      - id: end-of-file-fixer
        exclude: ^uv\.lock$
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.3
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # Protean IR hooks need to import domain modules to build the live IR,
  # so they must run in the project's own venv (not pre-commit's isolated
  # env). This is the same pattern pylint/mypy recommend for tools that
  # introspect user code. Domains are read from [domains] in
  # .protean/config.toml; --fix auto-regenerates stale IR and stages it.
  - repo: local
    hooks:
      - id: protean-check-staleness
        name: Check IR staleness
        entry: uv run protean-check-staleness --fix
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
