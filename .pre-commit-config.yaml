# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^uv\.lock$
      - id: end-of-file-fixer
        exclude: ^uv\.lock$
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.3
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # Protean IR hooks need to import domain modules to build the live IR,
  # so they must run in the project's own venv (not pre-commit's isolated
  # env). This is the same pattern pylint/mypy recommend for tools that
  # introspect user code. Domains are read from [domains] in
  # .protean/config.toml.
  #
  # Check-only (NOT --fix): the auto-fixer regenerates baselines WITHOUT the
  # canonical form (`protean-check-staleness` has no --canonical flag), which
  # would fight `make ir --canonical` and reintroduce timestamp/key-order churn.
  # So the hook only FAILS on staleness; `make ir` is the sole writer, keeping
  # baselines canonical. (Re-enable --fix once protean-check-staleness gains
  # --canonical: proteanhq/protean#1080.)
  - repo: local
    hooks:
      - id: protean-check-staleness
        name: Check IR staleness
        # PROTEAN_ENV=memory to match how `make ir` generates the baselines. The
        # IR captures env-dependent config (e.g. event_processing sync vs async),
        # so an env mismatch here reports a false "stale" (loyalty differs by env).
        entry: env PROTEAN_ENV=memory uv run protean-check-staleness
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
