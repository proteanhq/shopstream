# Capability map: ties each Protean capability to the code that teaches it,
# the check that guards it, and the property it must satisfy.
#
# Purpose:
#   - Make coverage visible: a capability with no `guarded_by` is a gap.
#   - Keep docs honest: `taught_by` is the real, idiomatic example.
#   - CI can read this file to (a) fail when a capability has no guard, and
#     (b) generate a "learn it / proof it works" index.
#
# Fields:
#   taught_by:  the file a newcomer reads to learn this capability (in src/ or tests/)
#   guarded_by: the check that proves it still works (in verification/ or tests/)
#   property:   the rule that must hold (see VERIFICATION_STRATEGY.md section 4)
#   source:     A | B | C  (where the check's right answer comes from; A is strongest)
#   status:     covered | partial | gap
#
# This is a seed. Every Protean capability should eventually have a row.

capabilities:

  - name: event_sourced_aggregate
    taught_by: src/ordering/order/order.py
    guarded_by: verification/metamorphic/test_replay_equals_live.py   # to build (P10)
    property: "from_events(events) == live aggregate state"
    source: B
    status: partial

  - name: snapshots
    taught_by: src/loyalty/campaign/campaign.py
    guarded_by: verification/metamorphic/test_snapshot_equals_replay.py   # to build (P11)
    property: "load via snapshot == full replay"
    source: B
    status: gap

  - name: projector_read_model
    taught_by: src/reviews/projections/product_rating.py
    guarded_by: verification/oracles/test_p20_projector_idempotency.py
    property: "delivering one event N times == delivering it once (P20)"
    source: A
    status: covered   # T0.3: projector made idempotent; P20 check passes

  - name: outbox_dual_write
    taught_by: src/payments/domain.toml   # external_brokers = ["global"]
    guarded_by: verification/oracles/test_outbox_exactly_once.py
    property: "exactly one outbox row per (message_id, target_broker) (P4)"
    source: A
    status: covered   # T1.2: dual-write shape + DB rejects a forced duplicate (IntegrityError)

  - name: optimistic_concurrency
    taught_by: src/inventory/stock/stock.py   # reserve() under contention
    guarded_by: verification/oracles/test_no_lost_updates.py
    property: "N concurrent writes at one aggregate: successes <= on_hand (never over-reserve), reserved == successes"
    source: A
    status: covered   # T1.1: multi-process on real Postgres + Message-DB; falsified with version_retry off

  - name: crash_window_reconciliation
    taught_by: src/inventory/stock/stock.py   # event-sourced; recovery is framework-level (ADR-0015)
    guarded_by: verification/oracles/test_crash_window_reconcile.py
    property: "a durable event whose relational commit crashed is still published after reconcile (P21)"
    source: A
    status: partial   # T1.3: window characterized (passes); recovery broken on message-db (proteanhq/protean#1073), xfail

  - name: cross_domain_acl_subscriber
    taught_by: src/reviews/review/ordering_subscriber.py
    guarded_by: verification/contracts/test_acl_payloads.py   # to build (P15)
    property: "published event payload matches what every subscriber reads"
    source: A
    status: gap

  - name: domain_service
    taught_by: src/loyalty/reward/transfer.py
    guarded_by: tests/loyalty/domain/test_transfer.py
    property: "cross-aggregate invariant holds (points conserved)"
    source: A
    status: covered

  - name: upcaster_chain
    taught_by: src/loyalty/campaign/upcasters.py
    guarded_by: tests/loyalty/application/test_campaign_persistence.py
    property: "old-version event upcasts and replays to current state (P13)"
    source: A
    status: covered

  - name: saga_process_manager
    taught_by: src/ordering/checkout/saga.py
    guarded_by: verification/resilience/test_saga_compensation.py   # to build (P16)
    property: "every saga reaches a terminal state; failure triggers compensation"
    source: A
    status: partial

  - name: command_deadline
    taught_by: src/payments/payment/initiation.py
    guarded_by: tests/payments/application/test_deadline_and_retry.py
    property: "expired command is skipped, never executed (P17)"
    source: A
    status: covered

  - name: ir_backward_compat
    taught_by: .protean/   # committed IR baselines per domain
    guarded_by: verification/contracts/test_ir_gate.py   # + `make ir-gate` in CI
    property: "IR diff flags breaking changes correctly (P14)"
    source: A
    status: covered   # T0.2: strict config + make ir-gate + CI + negative test
