# Capability map: ties each Protean capability to the code that teaches it,
# the check that guards it, and the property it must satisfy.
#
# Purpose:
#   - Make coverage visible: a capability with no `guarded_by` is a gap.
#   - Keep docs honest: `taught_by` is the real, idiomatic example.
#   - CI can read this file to (a) fail when a capability has no guard, and
#     (b) generate a "learn it / proof it works" index.
#
# Fields:
#   taught_by:  the file a newcomer reads to learn this capability (in src/ or tests/)
#   guarded_by: the check that proves it still works (in verification/ or tests/)
#   property:   the rule that must hold (see VERIFICATION_STRATEGY.md section 4)
#   source:     A | B | C  (where the check's right answer comes from; A is strongest)
#   status:     covered | partial | gap
#
# This is a seed. Every Protean capability should eventually have a row.

capabilities:

  - name: event_sourced_aggregate
    taught_by: src/ordering/order/order.py
    guarded_by: verification/metamorphic/test_replay_equals_live.py
    property: "from_events(events) == live aggregate state (P10)"
    source: B
    status: covered   # T2.1: replay==live over all 4 ES aggregates; found + FIXED the Payment attempt-id replay bug (now a passing guard)

  - name: aggregate_state_machine
    taught_by: src/inventory/stock/stock.py
    guarded_by: verification/model/test_inventory_model.py
    property: "random valid command sequences keep the aggregate == an independent plain-Python model (P2)"
    source: A
    status: covered   # T1.4: Hypothesis state machine vs hand-written model

  - name: snapshots
    taught_by: src/loyalty/campaign/campaign.py
    guarded_by: verification/metamorphic/test_snapshot_equals_replay.py
    property: "load via snapshot == full replay (P11)"
    source: B
    status: covered   # T2.1: snapshot load == full replay, and snapshot+tail == live (PromoCampaign)

  - name: stale_snapshot_fallback
    taught_by: src/loyalty/campaign/campaign.py
    guarded_by: verification/metamorphic/test_stale_snapshot_falls_back_to_replay.py
    property: "a snapshot that no longer builds is discarded with a warning, and the load equals a full replay"
    source: B
    status: covered   # PromoCampaign: removed, renamed and newly required fields, current and at_version loads, below the threshold. A stale snapshot that still builds is used as it is (open Protean finding, verification/regression/)

  - name: projector_read_model
    taught_by: src/payments/projections/daily_revenue.py
    guarded_by: verification/oracles/test_p20_projector_idempotency.py
    property: "delivering one event N times == delivering it once (P20)"
    source: A
    # Two kinds of protection, both guarded by P20. A projector marked
    # idempotent=True gets a processed-message marker per (message id, handler)
    # and skips a redelivery. ProductRatingProjector instead tracks which
    # reviews it has counted.
    status: covered

  - name: consume_idempotency_cleanup
    taught_by: src/payments/domain.toml
    guarded_by: verification/oracles/test_idempotency_cleanup.py
    property: "cleanup deletes markers older than retention_hours and keeps the rest"
    source: A
    status: covered   # make idempotency-cleanup runs it per domain

  - name: projection_convergence
    taught_by: src/inventory/projections/inventory_level.py
    guarded_by: verification/metamorphic/test_projection_equals_fold.py
    property: "projection == fold(events): a read model equals its aggregate's replayed state (P9)"
    source: B
    status: covered   # T2.1: InventoryLevel == InventoryItem.levels; weaker than the P20 oracle (shares stream bugs)

  - name: projector_concurrent_upsert
    taught_by: src/inventory/projections/low_stock_report.py
    guarded_by: verification/oracles/test_lowstock_projector_concurrency.py
    property: "concurrent level-triggered events for one key yield exactly one row; no command fails on the create-create race"
    source: A
    status: covered   # projector made concurrency-safe (per-projector transient retry, proteanhq/protean#1076)

  - name: outbox_dual_write
    taught_by: src/payments/domain.toml   # external_brokers = ["global"]
    guarded_by: verification/oracles/test_outbox_exactly_once.py
    property: "exactly one outbox row per (message_id, target_broker) (P4)"
    source: A
    status: covered   # T1.2: dual-write shape + DB rejects a forced duplicate (IntegrityError)

  - name: optimistic_concurrency
    taught_by: src/inventory/stock/stock.py   # reserve() under contention
    guarded_by: verification/oracles/test_no_lost_updates.py
    property: "N concurrent writes at one aggregate: successes <= on_hand (never over-reserve), reserved == successes"
    source: A
    status: covered   # T1.1: multi-process on real Postgres + Message-DB; falsified with version_retry off

  - name: crash_window_reconciliation
    taught_by: src/inventory/stock/stock.py   # event-sourced; recovery is framework-level (ADR-0015)
    guarded_by: verification/oracles/test_crash_window_reconcile.py
    property: "an event-sourced aggregate's durable event whose relational commit crashed gets its outbox rows back, the external global row included, from reconcile or the engine's startup sweep, when it is the context's newest event; another context's event or a command at the tail of the shared store gets no row (P21)"
    source: A
    status: covered   # T1.3: window characterized and recovery guarded; proteanhq/protean#1073, #1648 and #1653 fixed in the pin; three open findings are strict xfails

  - name: cross_domain_acl_subscriber
    taught_by: src/reviews/review/ordering_subscriber.py
    guarded_by: verification/contracts/test_acl_payloads.py
    property: "every published event's external payload feeds every subscriber on its stream with no KeyError (P15)"
    source: A
    status: covered   # T2.2: 84 producer×consumer pairs + 4 falsifications; real producer payload through real subscriber __call__

  - name: domain_service
    taught_by: src/loyalty/reward/transfer.py
    guarded_by: tests/loyalty/domain/test_transfer.py
    property: "cross-aggregate invariant holds (points conserved)"
    source: A
    status: covered

  - name: upcaster_chain
    taught_by: src/loyalty/campaign/upcasters.py
    guarded_by: tests/loyalty/application/test_campaign_persistence.py
    property: "old-version event upcasts and replays to current state (P13)"
    source: A
    status: covered

  - name: upcaster_gap_check
    taught_by: src/loyalty/campaign/upcasters.py
    guarded_by: verification/contracts/test_upcaster_gap.py
    property: "a version-N event missing an upcaster edge is flagged by `protean check` (UPCASTER_GAP); the real loyalty and ordering chains are not"
    source: A
    status: covered

  - name: lenient_deserialization
    taught_by: src/loyalty/campaign/events.py   # CampaignPaused(lenient=True)
    guarded_by: tests/loyalty/application/test_lenient_deserialization.py
    property: "a lenient event drops an unknown stored field and records its name in _dropped_fields; a non-lenient event still raises DeserializationError"
    source: A
    status: covered

  - name: saga_process_manager
    taught_by: src/ordering/checkout/saga.py
    guarded_by: verification/resilience/test_saga_compensation.py
    property: "every saga reaches a terminal state; failure triggers compensation (P16)"
    source: A
    status: covered   # T2.3: forced 3x payment failure -> order CANCELLED + reservation RELEASED + PM terminal, on the real async engine (engine-marked, local)

  - name: command_deadline
    taught_by: src/payments/payment/initiation.py
    guarded_by: tests/payments/application/test_deadline_and_retry.py
    property: "expired command is skipped, never executed (P17)"
    source: A
    status: covered

  - name: domain_clock
    taught_by: src/inventory/stock/expiry.py   # + ordering abandonment, notifications scheduler, reservation expiry
    guarded_by: tests/inventory/application/test_expiry_handler.py   # + the frozen-clock tests in ordering, notifications, payments
    property: "time-based handlers and the command deadline read domain.clock, so a frozen clock decides the outcome"
    source: A
    status: covered

  - name: auto_now
    taught_by: src/loyalty/reward/reward_account.py   # Auditable.created_at / updated_at
    guarded_by: tests/loyalty/application/test_audit_fields.py
    property: "created_at is stamped on insert only, updated_at on every save, both from the domain clock"
    source: A
    status: covered

  - name: aggregate_enricher
    taught_by: src/loyalty/reward/reward_account.py   # stamp_actor
    guarded_by: tests/loyalty/integration/test_audit_actor_api.py   # + tests/loyalty/application/test_audit_fields.py
    property: "a save made during an API request records its X-Actor-Id; a save with no bound actor (engine, subscriber, no header) records system; created_by is set only on insert"
    source: A
    status: covered

  - name: ir_backward_compat
    taught_by: .protean/   # committed IR baselines per domain
    guarded_by: verification/contracts/test_ir_gate.py   # + make ir-gate in CI; test_ir_gate_script.py for the exit-code reading
    property: "IR diff flags breaking changes correctly (P14)"
    source: A
    status: covered   # T0.2: strict config + make ir-gate + CI + negative test

  - name: docs_generated_from_code
    taught_by: docs/reviews/catalog.md   # protean docs generate --type=catalog
    guarded_by: make docs-check   # regenerates every catalog, fails on drift (in CI)
    property: "committed catalog.md == freshly generated from the domain (docs can't claim a missing feature)"
    source: A
    status: covered   # T1.6: docs-check gate + value-object doctests (make doctest)

  - name: event_model_render
    taught_by: docs/loyalty/event-model.md   # make docs-event-model; notes from .protean/loyalty/annotations.toml
    guarded_by: verification/contracts/test_event_model_render.py   # + make docs-check, which re-renders every event-model.md and fails on drift (in CI)
    property: "committed event-model.md == fresh render; a note lands in each slice that draws its element, and a key under [annotations] that matches nothing is reported"
    source: A
    status: partial   # subscribers and $any handlers are not drawn, the default annotations path is one file per project, some malformed notes are dropped or misreported, and the diagram docs are written with no final newline (xfail pins in verification/regression/test_tooling.py)

  - name: api_contract_fuzzing
    taught_by: src/app.py   # FastAPI routes + protean.integrations.fastapi exception handlers
    guarded_by: verification/fuzz/README.md   # make fuzz (schemathesis, nightly/local)
    property: "no schema-allowed request makes the API return 500 (shallow contract bug)"
    source: A
    status: partial   # T2.4: schemathesis harness; found+fixed pagination-overflow 500 (the counted_reviews 500 was a stale-table artifact, see T2.5)

  - name: adapter_conformance
    taught_by: src/loyalty/domain.toml   # two live providers: postgres default + sqlite reporting
    guarded_by: verification/conformance/test_dao_conformance.py   # make conformance (memory/sqlite/postgres)
    property: "the same DAO behavior (add/get/filter/order/paginate/unique/Dict) holds on every provider (skip-rate 0%)"
    source: A
    status: covered   # T2.5: 13 behaviors x 3 adapters green; built on Protean's own conformance plugin; corrected the T2.4 Dict finding

  - name: fault_tolerant_convergence
    taught_by: src/inventory/domain.toml   # outbox + async broker pipeline
    guarded_by: verification/resilience/test_toxiproxy_convergence.py   # make toxiproxy-verify
    property: "under a transient broker fault, a fixed workload still drains the outbox to zero and the projection converges (guarded: latency; partition findings documented)"
    source: A
    status: covered   # T2.6: Toxiproxy in front of Redis; latency convergence asserted; partition surfaced 3 engine-resilience findings (#1055-class), engine-marked/local. The latency case passes on some runs only until protean#1893 (out-of-order outbox publishing) is in the pin, #110

  - name: sync_async_equivalence
    taught_by: src/inventory/domain.toml   # event_processing = sync | async
    guarded_by: verification/metamorphic/test_sync_equals_async.py   # make sync-async-verify
    property: "the same workload yields the same read model whether events process inline (sync) or via the engine (async)"
    source: B
    status: covered   # T2.1 (deferred sub-item, now done): InventoryLevel identical sync vs async on real Postgres; engine-marked/local. Passes on some runs only until protean#1893 (out-of-order outbox publishing) is in the pin, #154

  - name: protean_verify
    taught_by: scripts/verify-domains.sh   # protean verify --json per context, memory mode
    guarded_by: verification/support/test_verify_domains_script.py   # the gate on canned envelopes; the real run is `bash scripts/verify-domains.sh`
    property: "each context inits with traversal, runs Domain.check, and passes its own tests under `protean verify --env memory`, with per-stage status read from the JSON envelope"
    source: B
    status: partial   # #51, #56: init, check and tests gate. The guard test covers the gate on canned envelopes only; the property itself is checked by running the script by hand until #57 wires it into CI

  - name: eventstore_integrity
    taught_by: scripts/eventstore-verify.sh   # make eventstore-verify; its summary line and exit code are guarded by verification/support/test_eventstore_verify_script.py
    guarded_by: verification/oracles/test_eventstore_integrity.py
    property: "after a fixed workload driven through the domain, the shared Message DB passes `verify` with counts equal to SQL; each injected corruption yields exactly one violation of the right kind, stream and position"
    source: A
    status: partial   # three of verify's six kinds (position_gap, snapshot_ahead_of_stream, malformed_snapshot) are injected on Message DB. The schema rejects the rows the other three need, and Protean's own tests check those on its memory and list-backed stores. Verify on the dev store under load is a hand check

  - name: restore_checkpoint_verification
    taught_by: docs/operations/restore.md
    guarded_by: verification/oracles/test_restore_checkpoints.py
    property: "after a simulated restore rolls the store and its global_position sequence back from g5 to g3, `protean recover --verify-checkpoints` reports a checkpoint at g5 as beyond head g3, a checkpoint at g2 and a fresh one as consistent, and a recovery-tracking entry at g5 as stale; `--reset-beyond-head` writes the int g3 to that checkpoint and clears only g5 from the tracking, and a third run finds nothing to report; with the shipped config no context has an event-store subscription for `recover` to check"
    source: A
    status: partial   # three inventory projectors, moved to event-store subscriptions in test config; every real handler reads Redis streams, so recover checks nothing in ShopStream as configured. A recovery-tracking stream recover cannot read (an unknown finding) is not exercised. Redis consumer groups and the Postgres outbox are outside recover's scope

  - name: engine_readiness_probe
    taught_by: src/ordering/domain.toml   # [server.health]
    guarded_by: verification/contracts/test_readyz_shape.py
    property: "/readyz on the ordering engine answers 200; every subscription the engine wired (handlers, broker subscribers, outbox processors including the `global` one) has a row and none is `unknown`; every row carries the documented fields including `lag_seconds` and `lag_drain_rate`; an empty outbox reads lag 0, not null; `lag_seconds` is null on every row, since ShopStream runs no event-store subscription"
    source: A
    status: partial   # the engine is built in test mode and its health server started by hand; Engine.run() is not used (proteanhq/protean#1055). lag_drain_rate is checked for presence only (one refresh, no numeric lag_seconds). Live rows under load are a hand check

  - name: engine_drain
    taught_by: README.md   # "Draining and stopping an engine"; [server] drain_timeout in each domain.toml
    guarded_by: verification/resilience/test_engine_drain.py   # + verification/contracts/test_process_ports.py
    property: "every context's engine reads drain_timeout 20.0; POST /drainz answers 200 with this process's pid; after it /readyz answers 503 with only checks.draining true, /healthz stays 200, GET /drainz is a 404; every stream subscription and broker subscriber would stop before its next read and every outbox processor would not; the seven contexts that consume the `global` bus wire a broker subscriber; each compose engine's stop_grace_period is at least 5 seconds longer than its drain window, which stays under the supervisor's 30-second kill"
    source: A
    status: partial   # the engine is built in test mode and its health server started by hand; Engine.run() is not used (proteanhq/protean#1055). Draining a live engine under load, stopping and restarting it with nothing left pending is the hand check `make verify-drain`. SIGTERM without a drain leaves messages pending under a dead consumer (proteanhq/protean#1929, pinned in verification/regression/test_messaging.py)

  - name: engine_health_ports
    taught_by: src/identity/domain.toml   # [server.health] port + port_auto_increment + host
    guarded_by: verification/contracts/test_process_ports.py
    property: "every context auto-increments on a PROTEAN_HEALTH_HOST-driven host; no two context ranges (base to base + 9) overlap; no fixed port (API, Observatory, Locust) falls in one; no scaled make target starts more workers than its range holds; each compose engine binds 0.0.0.0 and its healthcheck probes its context's base port"
    source: A
    status: covered   # the ten-port range is a ShopStream convention; Protean walks up to 100 ports

  - name: dlq_single_destination
    taught_by: src/loyalty/dlq/poison.py
    guarded_by: tests/loyalty/integration/test_dlq_ownership.py
    property: "a subscription's exhausted message lands once on {stream}:dlq, never in the broker's native DLQ, and leaves no retry_counts entry, also after a DLQ-publish outage"
    source: A
    status: covered   # Protean ADR-0042; StreamSubscription (loyalty) and BrokerSubscription (tests/payments/integration/test_dlq_ownership.py), InlineBroker and Redis

  - name: protean_install_extras
    taught_by: pyproject.toml   # the protean[...] requirement
    guarded_by: verification/support/test_protean_extras.py
    property: "every extra named on the protean requirement is one Protean defines; every provider and the telemetry table configured in src/*/domain.toml have their extra named; docker/entrypoint.dev.sh names the same set; the server and shell extras' modules import; under the test env a plain postgresql:// URL builds a psycopg (3) engine while psycopg2 is also installed, and loyalty's reporting store runs on SQLite"
    source: A
    status: covered   # the driver check skips in memory mode and runs in CI's real-stores job
